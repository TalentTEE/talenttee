    <g transform="translate(880, 25)">

    <line x1="795" y1="55" x2="880" y2="55" stroke="#f472b6" stroke-width="2" marker-end="url(#a3)"/>

    <rect x="880" y="160" width="160" height="50" rx="25" fill="#2d0f0f" stroke="#ef4444" stroke-width="2" filter="url(#sh3)"/>
    <text x="960" y="182" text-anchor="middle" font-size="13" fill="#fca5a5" font-weight="700">FAILED</text>
    <text x="960" y="198" text-anchor="middle" font-size="9" fill="#888">No deal / max rounds</text>
    <text x="975" y="148" font-size="10" fill="#f87171" font-weight="600">NO / MAX</text>

      <text x="190" y="28" text-anchor="middle" font-size="13" fill="#c4b5fd" font-weight="700">🔐 Encrypted Negotiation</text>

    <!-- Agreement detail box -->
