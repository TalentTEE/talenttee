[package]
name = "agreement"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6.0"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["alloc"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
