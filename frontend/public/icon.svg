<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2DF1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2DF1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Soft glow behind -->
  <circle cx="32" cy="34" r="24" fill="url(#glow)" opacity="0.15"/>

  <!-- Antenna stem -->
  <line x1="32" y1="14" x2="32" y2="6" stroke="url(#face)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna ball -->
  <circle cx="32" cy="5" r="3.5" fill="#FF2DF1"/>
  <!-- Antenna sparkle -->
  <circle cx="30.5" cy="3.8" r="1" fill="white" opacity="0.7"/>

  <!-- Head -->
  <rect x="10" y="14" width="44" height="36" rx="14" fill="url(#face)"/>

  <!-- Inner face plate -->
  <rect x="14" y="18" width="36" height="28" rx="10" fill="#0A0A12" opacity="0.85"/>

  <!-- Left eye -->
  <circle cx="23" cy="30" r="6.5" fill="white"/>
  <circle cx="24.5" cy="28.5" r="3.5" fill="#0A0A12"/>
  <circle cx="26" cy="27" r="1.5" fill="white"/>
  <circle cx="22" cy="30" r="1" fill="white" opacity="0.4"/>

  <!-- Right eye -->
  <circle cx="41" cy="30" r="6.5" fill="white"/>
  <circle cx="42.5" cy="28.5" r="3.5" fill="#0A0A12"/>
  <circle cx="44" cy="27" r="1.5" fill="white"/>
  <circle cx="40" cy="30" r="1" fill="white" opacity="0.4"/>

  <!-- Happy smile -->
  <path d="M25 38 Q32 44 39 38" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cheek blush -->
  <circle cx="18" cy="36" r="3" fill="#FF2DF1" opacity="0.25"/>
  <circle cx="46" cy="36" r="3" fill="#FF2DF1" opacity="0.25"/>

  <!-- Left ear -->
  <rect x="4" y="24" width="8" height="16" rx="4" fill="url(#face)"/>
  <rect x="6" y="28" width="4" height="8" rx="2" fill="#0A0A12" opacity="0.3"/>

  <!-- Right ear -->
  <rect x="52" y="24" width="8" height="16" rx="4" fill="url(#face)"/>
  <rect x="54" y="28" width="4" height="8" rx="2" fill="#0A0A12" opacity="0.3"/>

  <!-- Bottom body hint -->
  <rect x="20" y="50" width="24" height="10" rx="5" fill="url(#face)" opacity="0.5"/>
  <!-- Tie/heart -->
  <path d="M30 53 L32 57 L34 53 Q32 51 30 53Z" fill="#FF2DF1" opacity="0.6"/>
</svg>
